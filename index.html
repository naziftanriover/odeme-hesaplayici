<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ödeme Hesaplayıcı</title>
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kart">
    <header>
      <h1>Ödeme Hesaplayıcı</h1>
      <span class="marka">SOLİBET</span>
    </header>

    <!-- Ödenecek tutar -->
    <label class="odenecek">
      <span>Ödenecek Tutar (TL)</span>
      <input id="odenecek" inputmode="decimal" autocomplete="off" placeholder="0">
    </label>

    <!-- Döviz satırları -->
    <div class="tablo">
      <div class="satir baslik">
        <span>Döviz</span><span>Miktar</span><span>Kur</span><span>TL Karşılığı</span>
      </div>
      <div class="satir">
        <span class="doviz">STG £</span>
        <input id="miktar-STG" inputmode="decimal" autocomplete="off" placeholder="0">
        <input id="kur-STG" inputmode="decimal" autocomplete="off">
        <output id="tl-STG">0,00</output>
      </div>
      <div class="satir">
        <span class="doviz">USD $</span>
        <input id="miktar-USD" inputmode="decimal" autocomplete="off" placeholder="0">
        <input id="kur-USD" inputmode="decimal" autocomplete="off">
        <output id="tl-USD">0,00</output>
      </div>
      <div class="satir">
        <span class="doviz">EUR €</span>
        <input id="miktar-EUR" inputmode="decimal" autocomplete="off" placeholder="0">
        <input id="kur-EUR" inputmode="decimal" autocomplete="off">
        <output id="tl-EUR">0,00</output>
      </div>
      <div class="satir">
        <span class="doviz">TL ₺</span>
        <input id="miktar-TL" inputmode="decimal" autocomplete="off" placeholder="0">
        <span class="kur-yok">—</span>
        <output id="tl-TL">0,00</output>
      </div>

      <!-- TL banknot alt bölümü: adet girilirse TL miktarı otomatik dolar -->
      <details class="banknot" id="banknot-bolum">
        <summary>TL banknot adetleri <span id="banknot-ozet"></span></summary>
        <div class="banknot-izgara">
          <label><span>200 ₺</span><input data-kupur="200" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label><span>100 ₺</span><input data-kupur="100" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label><span>50 ₺</span><input data-kupur="50" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label><span>20 ₺</span><input data-kupur="20" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label><span>10 ₺</span><input data-kupur="10" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label><span>5 ₺</span><input data-kupur="5" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label class="coins"><span>COINS (₺ tutar)</span><input id="coins" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
        </div>
        <p class="ipucu">Adet yazınca TL miktarı kendiliğinden dolar. TL miktarını elle yazarsan adetler silinir.</p>
      </details>
    </div>

    <!-- Sonuçlar -->
    <section class="sonuc">
      <div class="kutu">
        <span>TOPLAM</span>
        <strong id="toplam">0,00</strong>
      </div>
      <div class="kutu kalan" id="kalan-kutu">
        <span>KALAN</span>
        <strong id="kalan">0,00</strong>
        <em id="durum">—</em>
      </div>
    </section>

    <p class="kalan-doviz" id="kalan-doviz"></p>

    <div class="butonlar">
      <button id="yazdir" type="button" class="yazdir">🖨 Fiş Yazdır</button>
      <button id="temizle" type="button">Temizle</button>
    </div>
  </main>

  <!-- Termal yazıcı fişi: sadece yazdırırken görünür -->
  <div id="fis" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
